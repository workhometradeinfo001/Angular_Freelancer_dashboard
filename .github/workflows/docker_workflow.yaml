name: Docker_Build_And_Push

on:
 workflow_run:
   workflows:
    - Test_Workflow
   types: completed

jobs:
  build-docker:
   runs-on: ubuntu-latest
   if: ${{github.event.workflow_run.conclusion == 'success'}}
   steps:
     - name: Checkout code
       uses: actions/checkout@v4
     - name: Build docker image
       run: docker build -t ${{secrets.ACR_LOGIN_SERVER}}/${{secrets.IMAGE_NAME}}:${{secrets.IMAGE_VERSION}} .

     - name: Login ACR
       uses: docker/login-action@v4
       with:
         registry: ${{secrets.ACR_LOGIN_SERVER}}
         username: ${{secrets.ACR_USER_NAME}}
         password: ${{secrets.ACR_PASSWORD}}

     - name: Push docker image
       run: docker push ${{secrets.ACR_LOGIN_SERVER}}/${{secrets.IMAGE_NAME}}:${{secrets.IMAGE_VERSION}}
   
     - name: After Success
       run: echo "Success"