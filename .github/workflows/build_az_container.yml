name: Build_Az_Container

on:
  workflow_run:
    workflows: Docker_Build_And_Push
    types: completed

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    steps:
      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{secrets.ACR_CLIENT_ID}}
          tenant-id: ${{secrets.ACR_TENANT_ID}}
          subscription-id: ${{secrets.ACR_SUB_ID}}

      - name: isEnvironment Exists
        run: |
          if az containerapp env show --name togo-environment --resource-group ${{secrets.ACR_RESOURCE_GROUP}} > /dev/null 2>&1; then
            echo "Environment exits, Skipping environment creation"
          else
            echo "Environment doesn't exists, Creating..."
            az containerapp env create \
            --name togo-environment \
            --resource-group ${{ secrets.ACR_RESOURCE_GROUP }} \
            --location southeastasia
          fi

      - name: Create Container
        run: |
          az containerapp up \
          --name freelancer-dashboard \
          --resource-group ${{secrets.ACR_RESOURCE_GROUP}} \
          --environment togo-environment \
          --location southeastasia \
          --image ${{secrets.ACR_LOGIN_SERVER}}/${{secrets.IMAGE_NAME}}:${{secrets.IMAGE_VERSION}} \
          --registry-server ${{secrets.ACR_LOGIN_SERVER}} \
          --registry-username ${{secrets.ACR_USER_NAME}} \
          --registry-password ${{secrets.ACR_PASSWORD}} \
          --target-port 4200 \
          --ingress external
          
