<div class="flex-container">
    <div class="container">
        <div class="row w-100 d-flex justify-content-center mt-5">
            <div class="col-10">
                <h3>{{headingFour}}</h3>
                <p class="mb-0">{{termsPara}}</p>
            </div>
        </div>
    </div>
    <hr />
    <div class="row d-flex justify-content-center">
        <div class="col-10">
            @for(term of termsObj; track term.id){
            @if(term.id != 4){
            <div class="col-12 mt-3 mb-3">
                <h5>{{term.heading}}</h5>
                <p>{{term.text}}</p>
            </div>
            }@else{
            <div class="col-12 mt-3 mb-3">
                <h5>{{term.heading}}</h5>
                <ul>
                    @for(item of term.text; track item;){
                    <li>{{item}}</li>
                    }
                </ul>
            </div>
            }
            }
        </div>

    </div>
</div>
<app-footer></app-footer>
