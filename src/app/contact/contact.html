<div class="flex-container">
    <div class="container">
        <div class="row mt-5">
            <div class="col-12 text-center">
                <h2>{{upperHeading}}</h2>
                <p>{{upperText}}</p>
            </div>
        </div>
    </div>
    <hr />
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="d-flex justify-content-between">
                    <div class="me-2 w-100">
                        <app-label fontSize="14px" text="First/Given Name"></app-label>
                        <app-input classInput="w-100 form-control" [inputType]="'text'" placeHolder="David"></app-input>
                    </div>
                    <div class="ms-2 w-100">
                        <app-label fontSize="14px" text="Last/Family Name"></app-label>
                        <app-input classInput="w-100 form-control" [inputType]="'text'" placeHolder="Jhon"></app-input>
                    </div>
                </div>
                <div class="w-100 mt-3">
                    <app-label text="Email"></app-label>
                    <app-input [inputType]="'email'" placeHolder="Enter your email"></app-input>
                </div>
                <div class="w-100 mt-3">
                    <app-select classSelete="w-100 form-select bg-light border-light-1" [itemsList]="items"></app-select>
                </div>
            </div>
            <div class="col-6">

            </div>
        </div>
    </div>
</div>
